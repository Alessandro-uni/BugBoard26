spring.application.name=BugBoard
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.expiration-time=86400000
application.security.jwt.jca-algorithm=HmacSHA256
application.security.jwt.jws-algorithm=HS256
app.security.pw-admin=${ADMIN_PW}
app.frontend.url=${FRONTEND_URL}

#Password rules
application.security.password.min-lenght=8
application.security.password.require-uppercase=true
application.security.password.require-lowercase=true
application.security.password.require-digit=true
application.security.password.require-special=true

